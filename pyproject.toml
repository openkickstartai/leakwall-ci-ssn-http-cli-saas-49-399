[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakwall"
version = "0.1.0"
description = "Intercept sensitive data leaks before production"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "LeakWall Team"}]
keywords = ["security", "pii", "dlp", "secrets", "compliance", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = ["typer>=0.9.0"]

[project.scripts]
leakwall = "leakwall:app"

[project.urls]
Homepage = "https://leakwall.dev"
Pricing = "https://leakwall.dev/pricing"
Source = "https://github.com/leakwall/leakwall"
